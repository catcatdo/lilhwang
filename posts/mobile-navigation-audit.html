    <h1>모바일 네비게이션은 왜 심사 인상에 큰 차이를 만드는가</h1>
    <p class="lead">개인 사이트는 모바일에서 처음 보는 경우가 많습니다. 메뉴가 불안정하면 콘텐츠가 좋아도 체감 품질이 급격히 떨어집니다.</p>
    <h2>점검 기준</h2>
    <ul>
      <li>상단 메뉴가 줄바꿈되어도 읽을 수 있는가</li>
      <li>푸터에서 기본 정보 페이지로 바로 이동 가능한가</li>
      <li>글 상세에서 목록과 홈으로 돌아가기 쉬운가</li>
    </ul>
    <p>작은 화면에서 길을 잃지 않게 만드는 것만으로도 사이트의 완성도는 훨씬 높아집니다.</p>
