    <h1>카테고리를 먼저 설계할 때 놓치지 말아야 할 원칙</h1>
    <p class="lead">카테고리는 사이트 운영의 뼈대입니다. 잘못 잡으면 글이 쌓일수록 오히려 구조가 흐려집니다.</p>
    <h2>원칙</h2>
    <ul>
      <li>카테고리 수는 적게 시작한다.</li>
      <li>한 카테고리에 최소 3개 이상 글이 들어갈 수 있어야 한다.</li>
      <li>카테고리명만 보고도 글 성격이 예상돼야 한다.</li>
    </ul>
    <p>주제는 바뀔 수 있지만 카테고리 구조는 자주 바뀌면 안 됩니다. 그래서 넓지만 추상적이지 않은 이름이 필요합니다.</p>
