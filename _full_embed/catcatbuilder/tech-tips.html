  <style>
    :root {
      --bg: #f3f7fb;
      --card: #ffffff;
      --text: #10223a;
      --accent: #0d6efd;
      --muted: #5f6c7b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(120deg, #f3f7fb 0%, #e6eefc 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 28px 18px 56px; }
    .nav {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .nav a {
      text-decoration: none;
      color: var(--accent);
      border: 1px solid #b6d0ff;
      background: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
    }
    .hero {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(16, 34, 58, 0.08);
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .meta { margin: 0; color: var(--muted); }
    ol {
      margin: 0;
      padding: 22px 26px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(16, 34, 58, 0.08);
      line-height: 1.65;
    }
    li { margin: 4px 0; }
  </style>

<body>
  <main class="wrap">
    <nav class="nav" aria-label="사이트 네비게이션">
      <a href="index.html">메인 홈</a>
      <a href="maker-diary.html">Maker Diary로 이동</a>
      <a href="tech-tips.html">Tech Tips</a>
    </nav>

    <section class="hero">
      <h1>개발자 팁 50개 주제</h1>
      <p id="meta" class="meta">데이터 불러오는 중...</p>
    </section>

    <ol id="topic-list"></ol>
  </main>

  <script>
    async function loadTopics() {
      try {
        const response = await fetch('tech-tips.json');
        if (!response.ok) throw new Error('JSON 로드 실패');
        const data = await response.json();

        const list = document.getElementById('topic-list');
        const meta = document.getElementById('meta');

        meta.textContent = `${data.title} | 총 ${data.topics.length}개 | 업데이트: ${data.updatedAt}`;
        list.innerHTML = data.topics.map((topic) => `<li>${topic}</li>`).join('');
      } catch (error) {
        document.getElementById('meta').textContent = '데이터를 불러오지 못했습니다.';
      }
    }
    loadTopics();
  </script>
</body>
</html>
