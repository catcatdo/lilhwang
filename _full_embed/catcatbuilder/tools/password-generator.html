<body>
  <main class="wrap">
    <header class="site-header">
      <nav class="site-nav">
        <a href="../index.html">홈</a>
        <a href="../developer-tools.html" aria-current="page">도구 스테이션</a>
      </nav>
    </header>
    <section class="hero">
      <h1>비밀번호 생성기</h1>
      <p>길이와 문자 규칙을 선택해 랜덤 비밀번호를 만듭니다.</p>
    </section>
    <section class="panel form-grid">
      <div class="form-row two">
        <div>
          <label for="len">길이</label>
          <input id="len" type="number" min="6" max="64" value="16">
        </div>
        <div>
          <label for="count">개수</label>
          <input id="count" type="number" min="1" max="10" value="3">
        </div>
      </div>
      <div class="form-row two">
        <label><input type="checkbox" id="lower" checked> 소문자</label>
        <label><input type="checkbox" id="upper" checked> 대문자</label>
      </div>
      <div class="form-row two">
        <label><input type="checkbox" id="numbers" checked> 숫자</label>
        <label><input type="checkbox" id="symbols" checked> 특수문자</label>
      </div>
      <div class="button-row">
        <button id="gen">생성</button>
      </div>
      <textarea id="output" readonly></textarea>
    </section>
  </main>
  <script>
    const lenEl = document.getElementById('len');
    const countEl = document.getElementById('count');
    const lowerEl = document.getElementById('lower');
    const upperEl = document.getElementById('upper');
    const numbersEl = document.getElementById('numbers');
    const symbolsEl = document.getElementById('symbols');
    const genBtn = document.getElementById('gen');
    const outputEl = document.getElementById('output');

    function generate() {
      const length = Math.max(6, Math.min(64, Number(lenEl.value) || 16));
      const count = Math.max(1, Math.min(10, Number(countEl.value) || 1));
      let pool = '';
      if (lowerEl.checked) pool += 'abcdefghijklmnopqrstuvwxyz';
      if (upperEl.checked) pool += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (numbersEl.checked) pool += '0123456789';
      if (symbolsEl.checked) pool += '!@#$%^&*()_+[]{}<>?';
      if (!pool) {
        outputEl.value = '문자 구성을 1개 이상 선택하세요.';
        return;
      }
      const result = [];
      for (let i = 0; i < count; i += 1) {
        let pass = '';
        for (let j = 0; j < length; j += 1) {
          pass += pool[Math.floor(Math.random() * pool.length)];
        }
        result.push(pass);
      }
      outputEl.value = result.join('\n');
    }

    genBtn.addEventListener('click', generate);
    generate();
  </script>
