<body>
  <main class="wrap">
    <header class="site-header">
      <nav class="site-nav">
        <a href="../index.html">홈</a>
        <a href="../developer-tools.html" aria-current="page">도구 스테이션</a>
      </nav>
    </header>
    <section class="hero">
      <h1>타이머 + 스톱워치</h1>
      <p>카운트다운 타이머와 스톱워치를 한 페이지에서 사용합니다.</p>
    </section>
    <section class="panel">
      <h2>타이머</h2>
      <div class="form-row two">
        <div>
          <label for="mins">분</label>
          <input id="mins" type="number" min="0" value="5">
        </div>
        <div>
          <label for="secs">초</label>
          <input id="secs" type="number" min="0" max="59" value="0">
        </div>
      </div>
      <div class="stat" id="timerView">05:00</div>
      <div class="button-row">
        <button id="timerStart">시작</button>
        <button id="timerReset" class="secondary">초기화</button>
      </div>
    </section>
    <section class="panel">
      <h2>스톱워치</h2>
      <div class="stat" id="swView">00:00.0</div>
      <div class="button-row">
        <button id="swStart">시작/정지</button>
        <button id="swReset" class="secondary">리셋</button>
      </div>
    </section>
  </main>
  <script>
    const minsEl = document.getElementById('mins');
    const secsEl = document.getElementById('secs');
    const timerViewEl = document.getElementById('timerView');
    const timerStartEl = document.getElementById('timerStart');
    const timerResetEl = document.getElementById('timerReset');
    const swViewEl = document.getElementById('swView');
    const swStartEl = document.getElementById('swStart');
    const swResetEl = document.getElementById('swReset');

    let timerInt = null;
    let timerLeft = 300;

    function timerFormat(total) {
      const mins = String(Math.floor(total / 60)).padStart(2, '0');
      const secs = String(total % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function drawTimer() {
      timerViewEl.textContent = timerFormat(Math.max(0, timerLeft));
    }

    timerStartEl.addEventListener('click', () => {
      if (timerInt) return;
      timerLeft = (Number(minsEl.value) || 0) * 60 + (Number(secsEl.value) || 0);
      drawTimer();
      timerInt = setInterval(() => {
        timerLeft -= 1;
        drawTimer();
        if (timerLeft <= 0) {
          clearInterval(timerInt);
          timerInt = null;
          alert('타이머 종료');
        }
      }, 1000);
    });

    timerResetEl.addEventListener('click', () => {
      clearInterval(timerInt);
      timerInt = null;
      timerLeft = (Number(minsEl.value) || 0) * 60 + (Number(secsEl.value) || 0);
      drawTimer();
    });

    let swInt = null;
    let swMs = 0;

    function drawStopwatch() {
      const mins = Math.floor(swMs / 60000);
      const secs = Math.floor((swMs % 60000) / 1000);
      const dec = Math.floor((swMs % 1000) / 100);
      swViewEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${dec}`;
    }

    swStartEl.addEventListener('click', () => {
      if (swInt) {
        clearInterval(swInt);
        swInt = null;
        return;
      }
      const startedAt = Date.now() - swMs;
      swInt = setInterval(() => {
        swMs = Date.now() - startedAt;
        drawStopwatch();
      }, 100);
    });

    swResetEl.addEventListener('click', () => {
      swMs = 0;
      drawStopwatch();
    });

    drawTimer();
    drawStopwatch();
  </script>
</body>
