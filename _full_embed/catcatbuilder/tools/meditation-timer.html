<body>
  <main class="wrap">
    <header class="site-header">
      <nav class="site-nav">
        <a href="../index.html">홈</a>
        <a href="../developer-tools.html" aria-current="page">도구 스테이션</a>
      </nav>
    </header>
    <section class="hero">
      <h1>명상 타이머</h1>
      <p>분 단위 타이머와 4-4 호흡 텍스트 가이드를 제공합니다.</p>
    </section>
    <section class="panel">
      <div class="form-row two">
        <div>
          <label for="minutes">명상 시간(분)</label>
          <input id="minutes" type="number" min="1" value="10">
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="start">시작</button>
        </div>
      </div>
      <div id="time" class="stat">10:00</div>
      <div id="breath" class="result">숨 들이마시기</div>
      <div class="button-row">
        <button id="stop" class="secondary">정지</button>
      </div>
    </section>
  </main>
  <script>
    const minutesEl = document.getElementById('minutes');
    const startEl = document.getElementById('start');
    const stopEl = document.getElementById('stop');
    const timeEl = document.getElementById('time');
    const breathEl = document.getElementById('breath');

    const phases = ['숨 들이마시기', '숨 멈추기', '숨 내쉬기', '숨 멈추기'];
    let left = 600;
    let timerInt = null;
    let breathInt = null;
    let phase = 0;

    function draw() {
      const mins = String(Math.floor(left / 60)).padStart(2, '0');
      const secs = String(left % 60).padStart(2, '0');
      timeEl.textContent = `${mins}:${secs}`;
    }

    startEl.addEventListener('click', () => {
      left = (Number(minutesEl.value) || 10) * 60;
      draw();

      clearInterval(timerInt);
      clearInterval(breathInt);

      timerInt = setInterval(() => {
        left -= 1;
        draw();
        if (left <= 0) {
          clearInterval(timerInt);
          clearInterval(breathInt);
          breathEl.textContent = '완료. 수고했어요.';
          alert('명상 시간이 끝났습니다.');
        }
      }, 1000);

      phase = 0;
      breathEl.textContent = phases[phase];
      breathInt = setInterval(() => {
        phase = (phase + 1) % phases.length;
        breathEl.textContent = phases[phase];
      }, 4000);
    });

    stopEl.addEventListener('click', () => {
      clearInterval(timerInt);
      clearInterval(breathInt);
    });

    draw();
  </script>
