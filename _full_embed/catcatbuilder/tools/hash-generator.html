<body><main class="wrap"><header class="site-header"><nav class="site-nav"><a href="../index.html">홈</a><a href="../developer-tools.html" aria-current="page">도구 스테이션</a></nav></header><section class="hero"><h1>SHA-256 해시 생성기</h1><p>문자열을 입력하면 SHA-256 해시를 계산합니다.</p></section><section class="panel"><label for="text">입력 문자열</label><textarea id="text"></textarea><div class="button-row"><button id="hash">해시 생성</button></div><label for="result">결과 해시</label><textarea id="result" readonly></textarea></section></main><script>async function h(){const t=document.getElementById('text').value;const b=new TextEncoder().encode(t);const d=await crypto.subtle.digest('SHA-256',b);const a=[...new Uint8Array(d)].map(v=>v.toString(16).padStart(2,'0')).join('');document.getElementById('result').value=a;}document.getElementById('hash').onclick=h;</script></body></html>
