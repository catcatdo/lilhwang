<body><main class="wrap"><header class="site-header"><nav class="site-nav"><a href="../index.html">홈</a><a href="../developer-tools.html" aria-current="page">도구 스테이션</a></nav></header><section class="hero"><h1>JSON 포맷터</h1><p>JSON을 읽기 좋은 형식으로 정렬하거나 압축합니다.</p></section><section class="panel"><div class="form-grid"><label for="input">입력 JSON</label><textarea id="input" placeholder='{"name":"cat","age":3}'></textarea><div class="button-row"><button id="pretty">예쁘게 정렬</button><button id="minify" class="secondary">압축</button></div><label for="output">결과</label><textarea id="output" readonly></textarea><p id="msg" class="meta"></p></div></section></main><script>const i=document.getElementById('input'),o=document.getElementById('output'),m=document.getElementById('msg');function run(space){try{const v=JSON.parse(i.value);o.value=JSON.stringify(v,null,space);m.textContent='완료';}catch(e){m.textContent='오류: '+e.message;}}document.getElementById('pretty').onclick=()=>run(2);document.getElementById('minify').onclick=()=>run(0);</script></body></html>
