<body>
  <main class="wrap">
    <header class="site-header">
      <nav class="site-nav">
        <a href="../index.html">홈</a>
        <a href="../developer-tools.html" aria-current="page">도구 스테이션</a>
      </nav>
    </header>
    <section class="hero">
      <h1>BMI 계산기</h1>
      <p>키와 몸무게로 체질량지수(BMI)를 계산합니다.</p>
    </section>
    <section class="panel form-grid">
      <div class="form-row two">
        <div>
          <label for="height">키 (cm)</label>
          <input id="height" type="number" value="170">
        </div>
        <div>
          <label for="weight">몸무게 (kg)</label>
          <input id="weight" type="number" value="65">
        </div>
      </div>
      <div class="button-row">
        <button id="calc">계산</button>
      </div>
      <div id="result" class="result"></div>
    </section>
  </main>
  <script>
    const heightEl = document.getElementById('height');
    const weightEl = document.getElementById('weight');
    const calcBtn = document.getElementById('calc');
    const resultEl = document.getElementById('result');

    function calculate() {
      const h = Number(heightEl.value) / 100;
      const w = Number(weightEl.value);
      if (!h || !w) {
        resultEl.textContent = '값을 확인하세요.';
        return;
      }
      const bmi = w / (h * h);
      let label = '정상';
      if (bmi < 18.5) label = '저체중';
      else if (bmi >= 25) label = '과체중';
      resultEl.textContent = `BMI ${bmi.toFixed(1)} (${label})`;
    }

    calcBtn.addEventListener('click', calculate);
    calculate();
  </script>
