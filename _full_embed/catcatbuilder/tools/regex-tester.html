<body><main class="wrap"><header class="site-header"><nav class="site-nav"><a href="../index.html">홈</a><a href="../developer-tools.html" aria-current="page">도구 스테이션</a></nav></header><section class="hero"><h1>정규식 테스터</h1><p>패턴과 플래그를 입력해 매칭 결과를 확인합니다.</p></section><section class="panel form-grid"><div class="form-row two"><div><label for="pattern">패턴</label><input id="pattern" value="\\bcat\\w*"/></div><div><label for="flags">플래그</label><input id="flags" value="gi"/></div></div><label for="text">텍스트</label><textarea id="text">cat, category, dog, CAT</textarea><div class="button-row"><button id="test">테스트</button></div><div id="result" class="result">결과가 여기에 표시됩니다.</div></section></main><script>document.getElementById('test').onclick=()=>{const p=document.getElementById('pattern').value,f=document.getElementById('flags').value,t=document.getElementById('text').value,r=document.getElementById('result');try{const re=new RegExp(p,f);const m=[...t.matchAll(re)].map(v=>v[0]);r.textContent=m.length?`매칭 ${m.length}개: ${m.join(', ')}`:'매칭 없음';}catch(e){r.textContent='오류: '+e.message;}};</script></body></html>
