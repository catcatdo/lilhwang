<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lilhwang.com</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --line:#2a2f3a; --text:#e8ecf1; --muted:#b6c0d0; --accent:#3a7afe; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:860px; margin:40px auto; padding:0 16px; }
    .panel { border:1px solid var(--line); background:var(--card); border-radius:14px; overflow:hidden; }
    .head { padding:18px 20px; border-bottom:1px solid var(--line); }
    .head h1 { margin:0; font-size:22px; }
    .head p { margin:6px 0 0; color:var(--muted); font-size:14px; }
    .menu { list-style:none; margin:0; padding:0; }
    .menu li { border-top:1px solid rgba(255,255,255,0.03); }
    .menu a { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; text-decoration:none; color:var(--text); }
    .menu a:hover { background:rgba(58,122,254,0.12); }
    .badge { background:var(--accent); color:#fff; font-size:12px; padding:4px 8px; border-radius:999px; }
    .desc { color:var(--muted); font-size:13px; margin-top:4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="head">
        <h1>lilhwang.com 메인 메뉴</h1>
        <p>현재는 3D 프린트 도구 중심으로 운영 중</p>
      </div>

      <ul class="menu">
        <li>
          <a href="/tools/photo-3d-print">
            <div>
              <div><strong>Photo → 3D Print</strong></div>
              <div class="desc">사진 업로드 · 배경 제거 · 치수 자동인식(OCR) · JSON 출력</div>
            </div>
            <span class="badge">바로가기</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</body>
</html>
