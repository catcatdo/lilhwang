name = "catcatbuilder-admin"
main = "src/worker.js"
compatibility_date = "2026-02-07"

[vars]
GITHUB_OWNER = "catcatdo"
GITHUB_REPO = "catcatbuilder"
GITHUB_BRANCH = "main"
POSTS_PATH = "posts.json"
RSS_PATH = "rss.xml"
SITE_URL = "https://lilhwang.com"
ALLOWED_ORIGINS = "https://lilhwang.com,http://localhost:8787,http://localhost:8000"

[[kv_namespaces]]
binding = "RANKINGS"
id = "RANKINGS_KV_ID"

[[kv_namespaces]]
binding = "NEWSLETTER_SUBSCRIBERS"
id = "NEWSLETTER_SUBSCRIBERS_KV_ID"

[[kv_namespaces]]
binding = "PUSH_SUBSCRIPTIONS"
id = "PUSH_SUBSCRIPTIONS_KV_ID"
