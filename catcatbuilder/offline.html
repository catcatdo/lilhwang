<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 모드 | 오늘의 개발자 뉴스</title>
  <meta name="theme-color" content="#d35400">
  <style>
    :root {
      --bg: #f3f4ef;
      --surface: #ffffff;
      --text: #111111;
      --muted: #63635e;
      --accent: #d35400;
      --line: #d8d8cf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 10% 0%, #f8f8f2 0%, var(--bg) 45%, #eceee6 100%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      padding: 22px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
    }
    p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.5;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    a,
    button {
      border: 1px solid #cb8c63;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      padding: 9px 14px;
      text-decoration: none;
      cursor: pointer;
    }
    .subtle {
      background: #fff;
      color: #333;
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>현재 오프라인입니다</h1>
    <p>네트워크 연결이 복구되면 최신 뉴스를 다시 불러올 수 있습니다. 연결이 없는 동안에는 이전에 방문한 캐시 페이지를 우선 제공합니다.</p>
    <div class="row">
      <a href="/index.html">홈으로 이동</a>
      <button type="button" class="subtle" onclick="window.location.reload()">다시 시도</button>
    </div>
  </main>
</body>
</html>
