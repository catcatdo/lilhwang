<body>

    <nav class="nav" aria-label="사이트 네비게이션">

    <section class="hero">
      <h1>DIY 프로젝트 50개 주제</h1>
      <p id="meta" class="meta">데이터 불러오는 중...</p>
    </section>

    <ol id="topic-list"></ol>
  </main>

  <script>
    async function loadTopics() {
      try {
        const response = await fetch('maker-diary.json');
        if (!response.ok) throw new Error('JSON 로드 실패');
        const data = await response.json();

        const list = document.getElementById('topic-list');
        const meta = document.getElementById('meta');

        meta.textContent = `${data.title} | 총 ${data.topics.length}개 | 업데이트: ${data.updatedAt}`;
        list.innerHTML = data.topics.map((topic) => `<li>${topic}</li>`).join('');
      } catch (error) {
        document.getElementById('meta').textContent = '데이터를 불러오지 못했습니다.';
      }
    }
    loadTopics();
  </script>
