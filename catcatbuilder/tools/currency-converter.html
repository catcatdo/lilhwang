<body>
  <main class="wrap">
    <header class="site-header">
      <nav class="site-nav">
        <a href="../index.html">홈</a>
        <a href="../developer-tools.html" aria-current="page">도구 스테이션</a>
      </nav>
    </header>
    <section class="hero">
      <h1>환율 변환기</h1>
      <p>Frankfurter API 기반 실시간 환율로 변환합니다.</p>
    </section>
    <section class="panel form-grid">
      <div class="form-row two">
        <div>
          <label for="amount">금액</label>
          <input id="amount" type="number" value="100">
        </div>
        <div>
          <label for="from">기준 통화</label>
          <select id="from"></select>
        </div>
      </div>
      <div class="form-row two">
        <div>
          <label for="to">변환 통화</label>
          <select id="to"></select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button id="convert">변환하기</button>
        </div>
      </div>
      <div id="result" class="result">로딩 중...</div>
      <p id="meta" class="meta"></p>
    </section>
  </main>
  <script>
    const currencies = ['USD', 'KRW', 'EUR', 'JPY', 'CNY', 'GBP', 'AUD', 'CAD', 'SGD', 'HKD'];
    const amountEl = document.getElementById('amount');
    const fromEl = document.getElementById('from');
    const toEl = document.getElementById('to');
    const convertBtn = document.getElementById('convert');
    const resultEl = document.getElementById('result');
    const metaEl = document.getElementById('meta');

    currencies.forEach((code) => {
      fromEl.add(new Option(code, code));
      toEl.add(new Option(code, code));
    });
    fromEl.value = 'USD';
    toEl.value = 'KRW';

    async function convertCurrency() {
      const amount = Number(amountEl.value) || 0;
      const from = fromEl.value;
      const to = toEl.value;
      if (from === to) {
        resultEl.textContent = `${amount.toLocaleString()} ${from}`;
        metaEl.textContent = '';
        return;
      }
      resultEl.textContent = '환율 조회 중...';
      try {
        const res = await fetch(`https://api.frankfurter.app/latest?amount=${amount}&from=${from}&to=${to}`);
        const data = await res.json();
        const converted = data.rates[to];
        resultEl.textContent = `${amount.toLocaleString()} ${from} = ${converted.toLocaleString()} ${to}`;
        metaEl.textContent = `기준일: ${data.date}`;
      } catch (error) {
        resultEl.textContent = '조회 실패. 네트워크 상태를 확인하세요.';
        metaEl.textContent = '';
      }
    }

    convertBtn.addEventListener('click', convertCurrency);
    convertCurrency();
  </script>
