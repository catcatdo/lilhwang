<body><main class="wrap"><header class="site-header"><nav class="site-nav"><a href="../index.html">홈</a><a href="../developer-tools.html" aria-current="page">도구 스테이션</a></nav></header><section class="hero"><h1>HEX / RGB 변환기</h1><p>색상 코드를 빠르게 상호 변환합니다.</p></section><section class="panel form-grid"><div class="form-row two"><div><label for="hex">HEX</label><input id="hex" value="#d35400"/></div><div><label for="rgb">RGB (예: 211,84,0)</label><input id="rgb" value="211,84,0"/></div></div><div class="button-row"><button id="h2r">HEX → RGB</button><button id="r2h" class="secondary">RGB → HEX</button></div><div id="swatch" class="result">샘플</div></section></main><script>const hex=document.getElementById('hex'),rgb=document.getElementById('rgb'),sw=document.getElementById('swatch');const paint=c=>{sw.style.background=c;sw.style.borderStyle='solid';sw.textContent=c;};document.getElementById('h2r').onclick=()=>{let h=hex.value.trim().replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');if(!/^[0-9a-fA-F]{6}$/.test(h)){sw.textContent='HEX 형식 오류';return;}const n=parseInt(h,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;rgb.value=`${r},${g},${b}`;paint(`#${h}`);};document.getElementById('r2h').onclick=()=>{const arr=rgb.value.split(',').map(v=>Number(v.trim()));if(arr.length!==3||arr.some(v=>Number.isNaN(v)||v<0||v>255)){sw.textContent='RGB 형식 오류';return;}const h=arr.map(v=>v.toString(16).padStart(2,'0')).join('');hex.value='#'+h;paint('#'+h);};paint('#d35400');</script></body></html>
