<body><main class="wrap"><header class="site-header"><nav class="site-nav"><a href="../index.html">홈</a><a href="../developer-tools.html" aria-current="page">도구 스테이션</a></nav></header><section class="hero"><h1>Base64 인코더/디코더</h1><p>텍스트를 Base64로 인코딩하거나 디코딩합니다.</p></section><section class="panel"><label for="input">입력</label><textarea id="input"></textarea><div class="button-row"><button id="encode">인코딩</button><button id="decode" class="secondary">디코딩</button></div><label for="output">결과</label><textarea id="output" readonly></textarea><p id="msg" class="meta"></p></section></main><script>const i=document.getElementById('input'),o=document.getElementById('output'),m=document.getElementById('msg');const enc=t=>btoa(unescape(encodeURIComponent(t)));const dec=t=>decodeURIComponent(escape(atob(t)));document.getElementById('encode').onclick=()=>{o.value=enc(i.value);m.textContent='인코딩 완료';};document.getElementById('decode').onclick=()=>{try{o.value=dec(i.value);m.textContent='디코딩 완료';}catch(e){m.textContent='오류: '+e.message;}};</script></body></html>
