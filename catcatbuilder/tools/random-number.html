<body>

    <header class="site-header">
      <nav class="site-nav">

        <a href="../developer-tools.html" aria-current="page">도구 스테이션</a>
      </nav>
    </header>
    <section class="hero">
      <h1>랜덤 숫자 생성기</h1>
      <p>최소~최대 범위에서 랜덤 정수를 생성합니다.</p>
    </section>
    <section class="panel form-grid">
      <div class="form-row two">
        <div>
          <label for="min">최소값</label>
          <input id="min" type="number" value="1">
        </div>
        <div>
          <label for="max">최대값</label>
          <input id="max" type="number" value="100">
        </div>
      </div>
      <div class="button-row">
        <button id="gen">생성</button>
      </div>
      <div id="out" class="stat">-</div>
    </section>
  </main>
  <script>
    const minEl = document.getElementById('min');
    const maxEl = document.getElementById('max');
    const genBtn = document.getElementById('gen');
    const outEl = document.getElementById('out');

    genBtn.addEventListener('click', () => {
      const min = Number(minEl.value);
      const max = Number(maxEl.value);
      if (min > max) {
        outEl.textContent = '범위 오류';
        return;
      }
      outEl.textContent = String(Math.floor(Math.random() * (max - min + 1)) + min);
    });
  </script>
