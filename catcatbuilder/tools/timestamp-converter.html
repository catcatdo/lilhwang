<body><main class="wrap"><header class="site-header"><nav class="site-nav"><a href="../index.html">홈</a><a href="../developer-tools.html" aria-current="page">도구 스테이션</a></nav></header><section class="hero"><h1>Unix 타임스탬프 변환기</h1><p>Unix 초/밀리초와 읽기 쉬운 날짜를 상호 변환합니다.</p></section><section class="panel form-grid"><div class="form-row two"><div><label for="stamp">Unix Timestamp</label><input id="stamp" type="number"/></div><div><label for="date">날짜/시간</label><input id="date" type="datetime-local"/></div></div><div class="button-row"><button id="toDate">Timestamp → 날짜</button><button id="toStamp" class="secondary">날짜 → Timestamp</button><button id="now" class="secondary">현재 시각</button></div><div id="result" class="result"></div></section></main><script>const stamp=document.getElementById('stamp'),date=document.getElementById('date'),result=document.getElementById('result');document.getElementById('toDate').onclick=()=>{const n=Number(stamp.value);if(!n){result.textContent='유효한 숫자를 입력하세요.';return;}const ms=n<1e12?n*1000:n;result.textContent=new Date(ms).toString();};document.getElementById('toStamp').onclick=()=>{if(!date.value){result.textContent='날짜를 입력하세요.';return;}const ms=new Date(date.value).getTime();result.textContent=`초: ${Math.floor(ms/1000)} / 밀리초: ${ms}`;};document.getElementById('now').onclick=()=>{const ms=Date.now();stamp.value=Math.floor(ms/1000);date.value=new Date(ms-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);result.textContent='현재 시각을 채웠습니다.';};</script></body></html>
