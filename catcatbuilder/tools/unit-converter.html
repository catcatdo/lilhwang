<body>
  <main class="wrap">
    <header class="site-header">
      <nav class="site-nav">
        <a href="../index.html">홈</a>
        <a href="../developer-tools.html" aria-current="page">도구 스테이션</a>
      </nav>
    </header>
    <section class="hero">
      <h1>단위 변환기</h1>
      <p>길이, 무게, 온도를 빠르게 변환합니다.</p>
    </section>
    <section class="panel form-grid">
      <div class="form-row two">
        <div>
          <label for="type">종류</label>
          <select id="type">
            <option value="length">길이</option>
            <option value="weight">무게</option>
            <option value="temp">온도</option>
          </select>
        </div>
        <div>
          <label for="value">값</label>
          <input id="value" type="number" value="1">
        </div>
      </div>
      <div class="form-row two">
        <div>
          <label for="from">기준 단위</label>
          <select id="from"></select>
        </div>
        <div>
          <label for="to">변환 단위</label>
          <select id="to"></select>
        </div>
      </div>
      <div class="button-row">
        <button id="convertBtn">변환</button>
      </div>
      <div id="result" class="result"></div>
    </section>
  </main>
  <script>
    const units = {
      length: { m: 1, km: 1000, cm: 0.01, in: 0.0254, ft: 0.3048 },
      weight: { kg: 1, g: 0.001, lb: 0.453592, oz: 0.0283495 }
    };

    const typeEl = document.getElementById('type');
    const valueEl = document.getElementById('value');
    const fromEl = document.getElementById('from');
    const toEl = document.getElementById('to');
    const convertBtn = document.getElementById('convertBtn');
    const resultEl = document.getElementById('result');

    function fillUnits() {
      const type = typeEl.value;
      fromEl.innerHTML = '';
      toEl.innerHTML = '';
      const keys = type === 'temp' ? ['C', 'F', 'K'] : Object.keys(units[type]);
      keys.forEach((key) => {
        fromEl.add(new Option(key, key));
        toEl.add(new Option(key, key));
      });
      toEl.selectedIndex = Math.min(1, toEl.options.length - 1);
    }

    function convertValue() {
      const type = typeEl.value;
      const value = Number(valueEl.value);

      if (type === 'temp') {
        let celsius = value;
        if (fromEl.value === 'F') celsius = (value - 32) * 5 / 9;
        else if (fromEl.value === 'K') celsius = value - 273.15;

        let out = celsius;
        if (toEl.value === 'F') out = celsius * 9 / 5 + 32;
        else if (toEl.value === 'K') out = celsius + 273.15;

        resultEl.textContent = `${value} ${fromEl.value} = ${out.toFixed(4)} ${toEl.value}`;
        return;
      }

      const base = value * units[type][fromEl.value];
      const out = base / units[type][toEl.value];
      resultEl.textContent = `${value} ${fromEl.value} = ${out.toFixed(6)} ${toEl.value}`;
    }

    typeEl.addEventListener('change', () => {
      fillUnits();
      convertValue();
    });
    convertBtn.addEventListener('click', convertValue);

    fillUnits();
    convertValue();
  </script>
