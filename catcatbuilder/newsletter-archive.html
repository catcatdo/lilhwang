<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뉴스레터 아카이브 | 릴황</title>
  <meta name="description" content="릴황 주간 뉴스레터 아카이브 페이지입니다.">
  <link rel="canonical" href="https://lilhwang.com/newsletter-archive.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="뉴스레터 아카이브 | 릴황">
  <meta property="og:description" content="지난 뉴스레터를 날짜별로 다시 확인하세요.">
  <meta property="og:url" content="https://lilhwang.com/newsletter-archive.html">
  <meta property="og:image" content="https://lilhwang.com/images/blog-fallback.svg">
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --line: #d9d5cc;
      --text: #111111;
      --muted: #5b5b5b;
      --accent: #bd4a0f;
      --radius: 14px;
      --shadow: 0 12px 32px rgba(17, 17, 17, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Space Grotesk", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at 10% 10%, #fff9f4 0%, var(--bg) 55%, #efede5 100%);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    .wrap {
      width: min(980px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .top-nav a {
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.85rem;
      color: inherit;
      background: #fbfaf7;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      letter-spacing: -0.02em;
    }

    .desc {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .cards {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .cards li {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px;
      background: #fcfcfa;
      display: grid;
      gap: 6px;
    }

    .cards h2 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.35;
    }

    .meta {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .summary {
      margin: 0;
      font-size: 0.9rem;
      color: #232323;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.84rem;
    }

    .links a {
      color: #6a2f13;
      text-underline-offset: 2px;
    }

    .cta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 0.9rem;
    }

    .cta a {
      display: inline-block;
      text-decoration: none;
      border: 1px solid #cf8d6c;
      background: #fff0e8;
      color: #7d2f0a;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <nav class="top-nav" aria-label="주요 페이지">
        <a href="index.html">홈</a>
        <a href="blog.html">블로그</a>
        <a href="newsletter.html">뉴스레터 구독</a>
        <a href="newsletter-archive.html">아카이브</a>
      </nav>
    </section>

    <section class="panel">
      <h1>뉴스레터 아카이브</h1>
      <p class="desc">지난 주차별 발행본과 해당 기간의 대표 글을 빠르게 확인할 수 있습니다.</p>
    </section>

    <section class="panel" aria-label="아카이브 목록">
      <ul id="archiveList" class="cards"></ul>
    </section>

    <section class="panel cta">
      <span>최신 발행분은 구독 페이지에서 메일로 받아보세요.</span>
      <a href="newsletter.html">뉴스레터 구독하러 가기</a>
    </section>
  </main>

  <script>
    const archives = [
      {
        issue: "2026-W08",
        date: "2026-02-23",
        title: "자동화 도구와 실전 개발 루틴",
        summary: "도커/깃허브 액션/로컬 자동화 관련 글 중심으로 정리한 주간판.",
        links: [
          { label: "도커 입문", href: "post-docker-guide-20260219.html" },
          { label: "GitHub Actions", href: "post-github-actions-20260219.html" },
          { label: "블로그 메인", href: "blog.html" }
        ]
      },
      {
        issue: "2026-W07",
        date: "2026-02-16",
        title: "생산성, 습관, 그리고 코드 품질",
        summary: "생산성 루틴과 실제 개발 흐름 개선 포인트를 중심으로 큐레이션.",
        links: [
          { label: "이슈 허브", href: "issues.html" },
          { label: "Tech Tips", href: "tech-tips.html" },
          { label: "Maker Diary", href: "maker-diary.html" }
        ]
      },
      {
        issue: "2026-W06",
        date: "2026-02-09",
        title: "현업에서 바로 쓰는 실무 팁",
        summary: "실제 작업에서 반복되는 문제를 줄이는 체크리스트와 가이드 모음.",
        links: [
          { label: "개발 워크플로", href: "guide-dev-workflow.html" },
          { label: "안전/개인정보", href: "guide-safety-privacy.html" },
          { label: "유틸리티 센터", href: "resource-center.html" }
        ]
      }
    ];

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    const list = document.getElementById("archiveList");
    list.innerHTML = archives.map((item) => {
      const links = item.links.map((link) => `<a href="${link.href}">${escapeHtml(link.label)}</a>`).join("");
      return `
        <li>
          <div class="meta">${escapeHtml(item.issue)} · ${escapeHtml(item.date)}</div>
          <h2>${escapeHtml(item.title)}</h2>
          <p class="summary">${escapeHtml(item.summary)}</p>
          <div class="links">${links}</div>
        </li>
      `;
    }).join("");
  </script>
</body>
</html>
